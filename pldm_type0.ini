[PACKET_FORMAT]
requester_pcie_busid = 5
target_pcie_busid = 9
dest_eid = 14
source_eid = 15
pldm_type_code = 19
pldm_command_code = 20

[PLDM_COMMAND_CODE]
01 = (SetTID)
02 = (GetTID)
03 = (GetPLDMVersion)
04 = (GetPLDMType)
05 = (GetPLDMcommands)

[SET_TID]
tid = 21;1
completion_code = 21;1

[GET_TID]
completion_code = 21;1
tid = 22;1

[GET_PLDM_VERSION_REQUEST]
data_transfer_handle = 21;4
transfer_operation_flag = 25;1
pldm_type = 26;1

[GET_PLDM_VERSION_RESPONSE]
completion_code = 21;1
next_data_transfer_handle = 22;4
transfer_flag = 26;1

[TRANSFER_OPERATION_FLAG]
00 = get next part
01 = get first part

[TRANSFER_FLAG]
01 = start
02 = middle
04 = end
05 = start and end

[GET_PLDM_TYPES]
completion_code = 21;1
pldm_types = 22;1

[GET_PLDM_COMMANDS_REQUEST]
pldm_type = 21;1
version = 22;4

[GET_PLDM_COMMANDS_RESPOND]
completion_code = 21;1
pldm_commands = 22;1

[COMPLETION_CODE]
00 = success
01 = error
02 = error invalid data
03 = error invalid length
04 = error not ready
05 = error unsupported pldm command 
80 = invalid data transfer handle
81 = invalid transfer operation flag
83 = invalid plfm type in request data