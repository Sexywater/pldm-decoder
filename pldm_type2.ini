#GET_SATE_SENSOR_READINGS
[GET_STATE_SENSOR_READINGS_REQUEST]
sensor_id = 21;2
rearm_event_state = 22;1

[GET_STATE_SENSOR_READINGS_RESPONSE]
completion_code = 21;1
composite_sensor_count = 22;1
sensor_operational_state = 23;1
present_state = 24;1
previous_state = 25;1
event_state = 26;1

################################################################################################################################################################
#GetPDRRepositoryInfo
[GET_PDR_REPOSITORY_INFO]
completion_code = 21;1
repository_state = 22;1
update_time = 23;13
oem_update_time = 36;13
record_count = 49;4
repository_size = 53;4
largest_record_size = 57;4
data_transfer_handle_timeout = 61;1

[REPOSITORY_STATE]
00 = availiable
01 = update in progress
02 = failed

[DATA_TRANSFER_HANDLE_TIMEOUT]
00 = no timeout
01 = default minimum timeout
FF = timeout>254 seconds

################################################################################################################################################################
#GetPDR
[GET_PDR_REQUEST]
record_handle = 21;4
data_transfer_handle = 25;4
transfer_operation_flag = 29;1
request_count = 30;2
record_change_number = 32;2

[TRANSFER_OPERATION_FLAG]
00 = get first part
01 = get next part

[GET_PDR_RESPONSE]
get_pdr_completion_code = 21;1
next_record_handle = 22;4
next_data_transfer_handle = 26;4
transfer_flag = 30;1
response_count = 31;2


[GET_PDR_COMPLETION_CODE]
00 = success
01 = error
02 = error invalid data
03 = error invalid length
04 = error not ready
05 = error unsupported pldm command 
80 = invalid data transfer handle
81 = invalid transfer operation flag
82 = invalid record handle
83 = invalid record change number
84 = transfer timeout
85 = repository update in progress

[TRANSFER_FLAG]
00 = start
01 = middle
04 = end
05 = start and end

[PDR_HEADER_FORMAT]
record_handle = 33;4
pdr_header_version = 37;1
pdr_type = 38;1
record_change_number = 39;2
data_length = 41;2

[PDR_TYPE]
01 = terminus locator pdr
02 = numeric sensor pdr
04 = state sensor pdr
0F = Entity Auxiliary Names PDR

[TERMINUS_LOCATOR_PDR]
pldm_terminus_handle = 43;2
validity = 45;1
tid = 46;1
container_id = 47;2
terminus_locator_type = 49;1
terminus_locator_value_size = 50;1

[VALIDITY]
00 = not valid
01 = valid

[TERMINUS_LOCATOR_TYPE]
00 = uid
01 = mctp_eid
02 = sm bus relative
03 = system software
04 = ncsi

[UID]
terminus_instance = 51;1
device_uid = 52

