################################################################################################################################################################
# VDM_HEADER
[PACKET_FORMAT]
requester_pcie_busid = 5
target_pcie_busid = 9
dest_eid = 14
source_eid = 15
pldm_type_code = 19
pldm_command_code = 20

[PLDM_TYPE_CODE] # value means different pldm type (type 0,2,4,5)
00 = (Messaging Control and Discovery)
02 = (Platform Monitoring and Control)
04 = (FRU Data)
05 = (Firmware Update)

[PLDM_COMMAND_CODE] #value means different command code
03 = (GetTerminusUID)
0A = (PlatformEventMessage)
11 = (GetSensorReading)
21 = (GetStateSensorReadings) 
50 = (GetPDRRepositoryInfo)
51 = (GetPDR)

################################################################################################################################################################
# PLATFORM_EVENT_MESSAGE
[PLATFORM_EVENT_MESSAGE] # The numbers represent the positions of the PLDM messages.
format_version = 21;1
tid = 22;1
event_class = 23;1


[EVENT_CLASS] #value means different command code
00 = sensor event 
#04 = pldmPDRRepositoryChgEvent 

[SENSOR_EVENT] # The numbers represent the positions of the PLDM messages.
sensor_id = 24;2
sensor_event_class = 26;1

[SENSOR_EVENT_CLASS] #value means different command code
00 = sensor_op_state
01 = state_sensor_state
02 = numeric_sensor_state

[STATE_SENSOR_STATE] # The numbers represent the positions of the PLDM messages.
sensor_offset = 27;1
event_state = 28;1
previous_event_state = 29;1

[NUMERIC_SENSOR_STATE] # The numbers represent the positions of the PLDM messages.
event_state = 27;1 
previous_event_state = 28;1
sensor_data_size = 29;1
present_reading = 30


################################################################################################################################################################
#GET_SENSOR_READING
[GET_SENSOR_READING_REQUEST] # The numbers represent the positions of the PLDM messages.
sensor_id = 21;2
rearm_event_state = 22;1

[GET_SENSOR_READING_RESPOND] # The numbers represent the positions of the PLDM messages.
completion_code = 21;1
sensor_data_size = 22;1
sensor_operational_state = 23;1
sensor_event_message_enable = 24;1
present_state = 25;1
previous_state = 26;1
event_state = 27;1
present_reading = 28

[COMPLETION_CODE]
00 = success
01 = error
02 = error invalid data
03 = error invalid length
04 = error not ready
05 = error unsupported pldm command 
80 = invalid sensor id
81 = rearm unavailable in present state

[SENSOR_DATA_SIZE]
00 = uint8
01 = sint8
02 = uint16
03 = sint16
04 = uint32
05 = sint32
06 = uint64
07 = sint64

[PRESENT_READING_LENGTH]
uint8 = 1
sint8 = 1
uint16 = 2
sint16 = 2
uint32 = 3
sint32 = 3
uint64 = 4
sint64 = 4

[SENSOR_OPERATIONAL_STATE]
00 = enabled
01 = disabled
02 = unavailiable
03 = status unknown
04 = failed
05 = initializing
06 = shutting down
07 = in test

[SENSOR_EVENT_MESSAGE_ENABLE]
01 = no event generation
02 = events disabled
03 = events enabled
04 = op event only enabled
05 = state events only enabled

[PRESENT_STATE]
