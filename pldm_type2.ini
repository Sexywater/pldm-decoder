04 = fatal
05 = lower warning 
06 = lower critical
07 = lower fatal
08 = upper warning
09 = upper critical
10 = upper fatal

[PREVIOUS_STATE]
00 = unknown
01 = normal
02 = warning
03 = critical
04 = fatal
05 = lower warning 
06 = lower critical
07 = lower fatal
08 = upper warning
09 = upper critical
10 = upper fatal

[EVENT_STATE]
